<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次初始化 · 报警助手</title><style>
body{margin:0;background:#eef0e9;color:#18251f;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:8vh auto;padding:42px;background:#fff;border-top:7px solid #185f48;box-shadow:0 20px 60px #173b2a20}h1{font-size:38px;margin:8px 0}.tag{font-size:12px;letter-spacing:.16em;color:#185f48;font-weight:700}.note,.error{padding:14px;margin:20px 0;background:#185f4810;border-left:4px solid #185f48;line-height:1.7}.error{border-color:#a33b2e;background:#a33b2e10;color:#7b2d24}.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700}input{width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #aaa}button{padding:13px 18px;background:#185f48;color:#fff;border:0;cursor:pointer}@media(max-width:650px){.wrap{margin:0;padding:28px}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="wrap"><div class="tag">LOCAL FIRST-RUN SETUP</div><h1>初始化系统管理员</h1><p class="note">该入口仅在本机且系统没有任何实名用户时开放。管理员只负责创建人员、企业范围和技术配置，默认不具备监控、规则审核或敏感证据权限。</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form class="form" method="post">{% csrf_token %}<label>登录用户名<input name="username" maxlength="150" required></label><label>员工工号<input name="employee_code" maxlength="100" required></label><label class="full">真实姓名<input name="display_name" maxlength="100" required></label><label class="full">强密码<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><div class="full"><button>创建并进入管理中心</button></div></form></main></body></html>
