<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>值班助手 · 实名登录</title>
  <style>
    :root{--ink:#13221c;--paper:#f2efe4;--line:#c9c0a8;--green:#14614a;--orange:#e56b36;--muted:#6f756d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper);font-family:"Noto Serif SC","Songti SC",serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:linear-gradient(90deg,transparent 49px,#b8af981f 50px),linear-gradient(transparent 49px,#b8af981f 50px);background-size:50px 50px}
    main{position:relative;display:grid;grid-template-columns:minmax(280px,1fr) minmax(360px,480px);min-height:100vh}
    .intro{display:flex;flex-direction:column;justify-content:space-between;padding:7vw;border-right:1px solid var(--line)}
    .mark{display:flex;align-items:center;gap:12px;font:700 14px/1 sans-serif;letter-spacing:.16em}.mark i{width:13px;height:13px;border-radius:50%;background:var(--green);box-shadow:0 0 0 7px #14614a1a}
    h1{max-width:720px;margin:14vh 0 20px;font-size:clamp(42px,6vw,92px);line-height:.98;font-weight:800;letter-spacing:-.06em}.lead{max-width:620px;color:var(--muted);font-size:18px;line-height:1.9}
    .boundary{padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font:13px/1.8 sans-serif}.boundary b{color:var(--orange)}
    .login{display:flex;align-items:center;padding:clamp(32px,6vw,76px)}.card{width:100%}.eyebrow{color:var(--green);font:700 12px/1 sans-serif;letter-spacing:.2em;text-transform:uppercase}
    h2{margin:14px 0 8px;font-size:34px}.hint{margin:0 0 36px;color:var(--muted);line-height:1.7}
    label{display:block;margin:0 0 20px;font:700 13px/1 sans-serif}input{width:100%;margin-top:9px;padding:15px 2px;border:0;border-bottom:2px solid var(--line);outline:none;color:var(--ink);background:transparent;font:18px/1.3 sans-serif;transition:.2s}input:focus{border-color:var(--green)}
    button{width:100%;margin-top:14px;padding:16px;border:0;color:#fff;background:var(--green);font:700 15px/1 sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:8px 8px 0 #b9b099;transition:.15s}button:hover{transform:translate(-2px,-2px);box-shadow:11px 11px 0 #b9b099}
    .error{margin:0 0 22px;padding:13px 15px;border-left:4px solid var(--orange);background:#e56b3612;color:#81391d;font:14px/1.6 sans-serif}
    @media(max-width:820px){main{grid-template-columns:1fr}.intro{min-height:42vh;border-right:0;border-bottom:1px solid var(--line)}h1{margin:10vh 0 18px}.login{padding:48px 28px}}
  </style>
</head>
<body>
<main>
  <section class="intro">
    <div class="mark"><i></i>湖南省三客一危 · 值班助手</div>
    <div><h1>责任到人，动作有界。</h1><p class="lead">监控、规则配置、规则审核与报表导出分权运行。助手身份和省平台账号必须同时满足权限，才能执行真实业务动作。</p></div>
    <div class="boundary"><b>当前为本地联调服务。</b> 未经客户授权、测试车辆确认和规则发布，不执行真实文本或语音动作。</div>
  </section>
  <section class="login"><div class="card">
    <div class="eyebrow">Named operator access</div><h2>实名助手登录</h2><p class="hint">登录后，插件会读取你的角色、企业范围和操作权限。请勿使用多人共享的助手账号。</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">{% csrf_token %}
      <label>账号<input name="username" autocomplete="username" required autofocus></label>
      <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">进入值班助手</button>
    </form>
  </div></section>
</main>
</body>
</html>
