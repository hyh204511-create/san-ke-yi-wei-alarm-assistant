<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>两客一危智能监管平台 AI 报警处置助手 - 新版交互原型</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --blue: #2563eb;
      --blue-2: #1d4ed8;
      --blue-soft: #eff6ff;
      --green: #059669;
      --green-soft: #ecfdf5;
      --amber: #b45309;
      --amber-soft: #fffbeb;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --cyan: #0891b2;
      --cyan-soft: #ecfeff;
      --violet: #7c3aed;
      --violet-soft: #f5f3ff;
      --nav: #101828;
      --nav-2: #172033;
      --shadow: 0 14px 38px rgba(15, 23, 42, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      background: linear-gradient(180deg, var(--nav), var(--nav-2));
      color: #dbe7f5;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 8px 8px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      background: linear-gradient(135deg, #38bdf8, #2563eb 55%, #7c3aed);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .brand strong {
      display: block;
      font-size: 15px;
      line-height: 1.25;
      color: #fff;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: #9fb6d2;
      font-size: 12px;
      line-height: 1.35;
    }

    .nav {
      display: grid;
      gap: 6px;
      padding: 16px 0;
    }

    .nav button {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: var(--radius);
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #b9c6d8;
      background: transparent;
      text-align: left;
    }

    .nav button:hover,
    .nav button.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.10);
    }

    .nav svg,
    .btn svg,
    .icon-btn svg,
    .mini-action svg {
      width: 17px;
      height: 17px;
      stroke-width: 2.1;
      flex: 0 0 auto;
    }

    .side-note {
      margin-top: auto;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
      padding: 14px;
      background: rgba(255, 255, 255, 0.06);
    }

    .side-note b {
      display: block;
      color: #fff;
      font-size: 13px;
    }

    .side-note span {
      display: block;
      margin-top: 8px;
      color: #a9bad0;
      line-height: 1.5;
      font-size: 12px;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: 64px minmax(0, 1fr);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(245, 247, 251, 0.92);
      backdrop-filter: blur(14px);
    }

    .crumb {
      min-width: 220px;
      display: grid;
      gap: 2px;
    }

    .crumb span {
      color: var(--muted);
      font-size: 12px;
    }

    .crumb strong {
      font-size: 16px;
      line-height: 1.25;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      min-width: 0;
    }

    .search {
      width: min(320px, 28vw);
      height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 12px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .status-pill {
      min-height: 30px;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--blue);
      background: var(--blue-soft);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .btn,
    .icon-btn,
    .mini-action {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn {
      padding: 0 13px;
    }

    .icon-btn {
      width: 36px;
      padding: 0;
    }

    .mini-action {
      min-height: 30px;
      padding: 0 10px;
      font-size: 12px;
    }

    .btn:hover,
    .icon-btn:hover,
    .mini-action:hover {
      border-color: var(--line-strong);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
    }

    .btn.primary,
    .mini-action.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .btn.danger,
    .mini-action.danger {
      border-color: var(--red);
      background: var(--red);
      color: #fff;
    }

    .btn.success,
    .mini-action.success {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }

    .btn.warn,
    .mini-action.warn {
      border-color: #d97706;
      background: #d97706;
      color: #fff;
    }

    .content {
      min-width: 0;
      overflow: auto;
    }

    .view {
      display: none;
      padding: 22px;
    }

    .view.active {
      display: block;
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .page-head h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
    }

    .page-head p {
      margin: 8px 0 0;
      max-width: 960px;
      color: var(--muted);
      line-height: 1.55;
    }

    .head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 14px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
      min-width: 0;
    }

    .metric span {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .metric strong {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 10px;
      font-size: 27px;
      line-height: 1;
    }

    .metric em {
      font-style: normal;
      color: var(--muted-2);
      font-size: 12px;
      font-weight: 650;
    }

    .workbench-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .embed-shell {
      display: block;
      margin-bottom: 14px;
    }

    .platform-stage {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      overflow: hidden;
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(420px, 1fr) auto;
    }

    .platform-toolbar {
      min-height: 48px;
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fbfdff;
    }

    .platform-toolbar strong {
      display: block;
      font-size: 14px;
    }

    .platform-toolbar span {
      color: var(--muted);
      font-size: 12px;
    }

    .platform-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .platform-tab {
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .platform-tab.active {
      color: var(--blue);
      border-color: #bfdbfe;
      background: var(--blue-soft);
    }

    .platform-canvas {
      position: relative;
      min-height: 420px;
      background: #f8fafc;
      overflow: hidden;
    }

    .platform-canvas img {
      width: 100%;
      height: 100%;
      min-height: 420px;
      object-fit: cover;
      display: block;
      opacity: 0.88;
    }

    .alarm-popover {
      position: absolute;
      top: 22px;
      right: 20px;
      width: min(360px, calc(100% - 40px));
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 18px 46px rgba(15, 23, 42, 0.18);
      padding: 12px;
    }

    .alarm-popover h3 {
      margin: 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .alarm-popover h3 svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--red);
    }

    .alarm-popover p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 12px;
    }

    .plugin-anchor {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 52px;
      background: rgba(37, 99, 235, 0.10);
      border-left: 1px solid rgba(37, 99, 235, 0.25);
      display: grid;
      place-items: center;
      color: var(--blue);
      font-weight: 850;
      writing-mode: vertical-rl;
      letter-spacing: 0;
      font-size: 12px;
    }

    .platform-status-strip {
      border-top: 1px solid var(--line);
      padding: 10px 12px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      background: #fff;
    }

    .platform-status-strip .info {
      padding: 8px;
    }

    .plugin-drawer {
      min-width: 0;
      position: fixed;
      right: 22px;
      top: 82px;
      width: 430px;
      height: calc(100vh - 104px);
      z-index: 45;
    }

    .plugin-drawer .panel {
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .sidepanel-shell {
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .sidepanel-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      background: #fff;
    }

    .sidepanel-head h2 {
      margin: 0;
      font-size: 15px;
    }

    .sidepanel-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .sidepanel-scroll {
      overflow: auto;
      padding: 12px;
      display: grid;
      gap: 12px;
      align-content: start;
      background: #f8fafc;
      min-height: 0;
    }

    .secondary-workbench {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .sidepanel-section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }

    .sidepanel-section header {
      min-height: 42px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sidepanel-section header h3 {
      margin: 0;
      font-size: 14px;
    }

    .sidepanel-section .body {
      padding: 12px;
    }

    .sidepanel-queue {
      max-height: 320px;
      overflow: auto;
    }

    .sidepanel-queue .filter-row {
      padding: 10px;
    }

    .sidepanel-queue .alarm-list {
      max-height: none;
      padding: 8px;
    }

    .compact-detail {
      display: grid;
      gap: 8px;
    }

    .compact-detail .info-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .compact-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .compact-title strong {
      font-size: 15px;
    }

    .mount-list {
      display: grid;
      gap: 8px;
    }

    .mount-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 10px;
      display: grid;
      gap: 4px;
    }

    .mount-item strong {
      font-size: 13px;
    }

    .mount-item span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .trial-list {
      display: grid;
      gap: 8px;
    }

    .trial-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      background: #fff;
      display: grid;
      gap: 5px;
    }

    .trial-item strong {
      font-size: 13px;
    }

    .trial-item span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      min-width: 0;
    }

    .panel-head {
      min-height: 54px;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
    }

    .panel-body {
      padding: 15px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      min-height: 27px;
      padding: 0 10px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip.active,
    .chip.blue {
      border-color: #bfdbfe;
      color: var(--blue);
      background: var(--blue-soft);
    }

    .chip.green {
      border-color: #bbf7d0;
      color: var(--green);
      background: var(--green-soft);
    }

    .chip.amber {
      border-color: #fde68a;
      color: var(--amber);
      background: var(--amber-soft);
    }

    .chip.red {
      border-color: #fecaca;
      color: var(--red);
      background: var(--red-soft);
    }

    .chip.cyan {
      border-color: #a5f3fc;
      color: var(--cyan);
      background: var(--cyan-soft);
    }

    .chip.violet {
      border-color: #ddd6fe;
      color: var(--violet);
      background: var(--violet-soft);
    }

    .alarm-list {
      max-height: calc(100vh - 285px);
      overflow: auto;
      padding: 8px;
    }

    .alarm-item {
      width: 100%;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      text-align: left;
      padding: 11px;
      margin-bottom: 8px;
    }

    .alarm-item:hover {
      border-color: var(--line);
      background: var(--surface-soft);
    }

    .alarm-item.active {
      border-color: #bfdbfe;
      background: var(--blue-soft);
    }

    .alarm-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .alarm-top strong {
      font-size: 15px;
      color: var(--text);
    }

    .alarm-meta {
      display: grid;
      gap: 5px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .badge {
      min-height: 22px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 0 8px;
      color: var(--muted);
      background: #eef2f7;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.blue {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .badge.green {
      color: var(--green);
      background: var(--green-soft);
    }

    .badge.amber {
      color: var(--amber);
      background: var(--amber-soft);
    }

    .badge.red {
      color: var(--red);
      background: var(--red-soft);
    }

    .badge.cyan {
      color: var(--cyan);
      background: var(--cyan-soft);
    }

    .badge.violet {
      color: var(--violet);
      background: var(--violet-soft);
    }

    .evidence-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
      gap: 14px;
      align-items: start;
    }

    .visual {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #0b1220;
      min-height: 264px;
      position: relative;
    }

    .visual img {
      width: 100%;
      height: 100%;
      min-height: 264px;
      object-fit: cover;
      display: block;
      opacity: 0.92;
    }

    .visual-overlay {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #fff;
      font-size: 12px;
    }

    .hud-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 999px;
      padding: 6px 9px;
      background: rgba(15, 23, 42, 0.68);
      backdrop-filter: blur(10px);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .info {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      padding: 10px;
      min-width: 0;
    }

    .info span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .info strong {
      display: block;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .source-list,
    .timeline,
    .stepper,
    .guard-list {
      display: grid;
      gap: 8px;
    }

    .source-item,
    .step,
    .guard,
    .timeline-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      background: #fff;
    }

    .source-item {
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 10px;
      align-items: center;
    }

    .source-item span {
      color: var(--muted);
      font-size: 12px;
    }

    .source-item strong {
      line-height: 1.35;
    }

    .section-title {
      margin: 15px 0 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-title h3 {
      margin: 0;
      font-size: 14px;
    }

    .timeline {
      max-height: 230px;
      overflow: auto;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      gap: 10px;
      position: relative;
    }

    .timeline-item time {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .timeline-item strong {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .timeline-item p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 12px;
    }

    .step {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .step-index {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: #eef2f7;
      font-size: 12px;
      font-weight: 850;
    }

    .step.done .step-index {
      color: #fff;
      background: var(--green);
    }

    .step.active .step-index {
      color: #fff;
      background: var(--blue);
    }

    .step.block .step-index {
      color: #fff;
      background: var(--amber);
    }

    .step strong {
      display: block;
      font-size: 13px;
    }

    .step span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .action-grid .btn {
      width: 100%;
      min-height: 38px;
      padding: 0 9px;
    }

    .assistant-note {
      border: 1px solid #bfdbfe;
      border-radius: var(--radius);
      background: var(--blue-soft);
      padding: 12px;
      color: #1e3a8a;
      line-height: 1.5;
      font-size: 13px;
    }

    .blocker-note {
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      background: var(--red-soft);
      padding: 12px;
      color: #991b1b;
      line-height: 1.5;
      font-size: 13px;
      font-weight: 650;
    }

    .platform-banner {
      border: 1px solid #bfdbfe;
      border-radius: var(--radius);
      background: linear-gradient(90deg, #eff6ff, #ffffff);
      padding: 11px 13px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #1e3a8a;
      line-height: 1.45;
    }

    .platform-banner strong {
      color: #172554;
    }

    .platform-banner span {
      color: #475569;
      font-size: 12px;
    }

    .blocked-action {
      opacity: 0.58;
      cursor: not-allowed;
    }

    .guard {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      color: var(--muted);
      line-height: 1.45;
      font-size: 12px;
    }

    .guard b {
      color: var(--text);
    }

    .split-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
      align-items: start;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px 11px;
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: var(--muted);
      background: #f8fafc;
      font-size: 12px;
      font-weight: 800;
    }

    td {
      color: #263447;
    }

    tr:hover td {
      background: #fafcff;
    }

    .table-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .detail-box {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      overflow: hidden;
    }

    .detail-box header {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .detail-box header h3 {
      margin: 0;
      font-size: 15px;
    }

    .detail-box .body {
      padding: 14px;
    }

    .copy-block {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      padding: 11px;
      color: #334155;
      line-height: 1.55;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .scope-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      overflow: hidden;
    }

    .scope-card header {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .scope-card header h3 {
      margin: 0;
      font-size: 15px;
    }

    .scope-card ul {
      margin: 0;
      padding: 12px 16px 15px 30px;
      color: #334155;
      line-height: 1.75;
    }

    .readiness {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .check-row {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 13px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .check-row strong {
      display: block;
      margin-bottom: 5px;
    }

    .check-row span {
      color: var(--muted);
      line-height: 1.45;
      font-size: 12px;
    }

    .switch {
      width: 42px;
      height: 24px;
      border: 0;
      border-radius: 999px;
      background: #cbd5e1;
      position: relative;
      flex: 0 0 auto;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.22);
      transition: transform 0.18s ease;
    }

    .switch.on {
      background: var(--blue);
    }

    .switch.on::after {
      transform: translateX(18px);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.45);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(880px, 96vw);
      max-height: 88vh;
      overflow: hidden;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 28px 72px rgba(15, 23, 42, 0.24);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .modal-head,
    .modal-foot {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-foot {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 16px;
    }

    .modal-body {
      padding: 16px;
      overflow: auto;
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 80;
      width: min(380px, calc(100vw - 44px));
      display: none;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 18px 46px rgba(15, 23, 42, 0.18);
      padding: 13px 14px;
    }

    .toast.show {
      display: block;
      animation: slide-in 0.18s ease-out;
    }

    .toast strong {
      display: block;
      margin-bottom: 5px;
    }

    .toast p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 13px;
    }

    @keyframes slide-in {
      from {
        transform: translateY(10px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 1430px) {
      .metric-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .workbench-grid {
        grid-template-columns: 330px minmax(500px, 1fr);
      }

      .workbench-grid > .panel:last-child {
        grid-column: 1 / -1;
      }

      .embed-shell {
        padding-right: 0;
      }

      .plugin-drawer {
        width: 390px;
      }

      .action-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
      }

      .nav {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .side-note {
        display: none;
      }

      .topbar {
        position: static;
        align-items: flex-start;
        flex-direction: column;
        height: auto;
        padding: 12px;
      }

      .search {
        width: 100%;
      }

      .top-actions {
        width: 100%;
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      .metric-grid,
      .embed-shell,
      .workbench-grid,
      .secondary-workbench,
      .evidence-layout,
      .split-layout,
      .matrix,
      .readiness {
        grid-template-columns: 1fr;
      }

      .plugin-drawer {
        position: static;
        width: auto;
        height: auto;
      }

      .embed-shell {
        padding-right: 0;
      }

      .action-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .platform-status-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

    function infoPack(a) {

企业：${a.company}
驾驶员：${a.driver}
报警类型：${a.type}
报警时间：${a.time}

速度：${a.speed} km/h
提醒方式：${a.remind}
纠正检测：${a.correction}
当前状态：${a.status}`;
    }

    function maskedInfoPack(a) {
      return `车牌：${a.vehicle.replace(/(.{2}).+(\(.+\))/, "$1****$2")}
企业：${a.company.slice(0, 4)}****
驾驶员：${a.driver.slice(0, 1)}**
报警类型：${a.type}
报警时间：${a.time}
地点：${a.location.split(" ")[0]}****
提醒方式：${a.remind}
纠正检测：${a.correction}

完整信息被隐藏：短信详情页访问控制、有效期或身份校验未就绪。`;

    function selectEvent(id) {
      state.selectedEvent = id;
      state.selectedAlarm = id;
      render();
    }

    function captureAlarm() {
      const a = currentAlarm();
      if (a.capture === "已捕获") {
        toast("弹窗已捕获", `${a.vehicle} 已在报警队列中。`);
        return;
      }
      a.capture = "已捕获";
      a.status = "待处置";
      addTimeline(a, "报警弹窗捕获", `插件捕获 ${a.vehicle} 的 ${a.type}，已读取弹窗入口。`);

      render();
    }

    function readDetail() {
      const a = currentAlarm();
      if (a.capture === "未监听") {
        toast("需要先监听报警", "先捕获弹窗或从报警列表兜底读取，再打开详情。");
        return;
      }
      if (a.video === "视频不可用") {
        a.read = "字段缺失";
        a.status = "待人工接管";
        addTimeline(a, "报警详情读取异常", "视频不可用或 DOM 字段缺失，系统提示人工接管。");

        a.read = "详情已读取";
        addTimeline(a, "报警详情读取", "已读取速度、位置、车辆状态、视频状态和页面按钮状态。");
        toast("详情读取完成", "页面字段已按来源标记，等待规则匹配。");
      }
      render();
    }

    function matchRule() {
      const a = currentAlarm();
      if (a.read === "未读取") {
        toast("需要先读取详情", "规则匹配需要报警详情字段作为事实输入。");
        return;
      }
      const r = rules.find(item => item.type === a.type);
      if (!r) {
        a.rule = "未配置";
        blockAction(a, "规则匹配失败", "当前报警类型未配置处置规则，必须人工接管。", "待人工接管");
        return;
      }
      a.rule = r.status === "已确认" ? "规则已匹配" : r.status === "口径差异" ? "口径差异" : "待规则确认";
      if (a.rule === "口径差异") a.status = "待规则确认";
      if (a.rule === "待规则确认") a.status = "待规则确认";
      addTimeline(a, "规则与 SOP 匹配", `命中 ${a.type}：${r.method}；规则状态：${r.status}。`);
      toast(a.rule === "规则已匹配" ? "规则已匹配" : "规则阻断", a.rule === "规则已匹配" ? "已输出首版建议动作。" : "规则未确认，禁止自动触发司机提醒。");
      render();
    }

    function sendVoice() {
      const a = currentAlarm();
      if (a.rule !== "规则已匹配") {
        blockAction(a, "语音对讲被阻断", "规则未确认或存在口径差异，不能自动触发司机提醒。", "待规则确认");
        return;
      }
      const blockers = actionBlockers(a);
      if (blockers.length) {
        blockAction(a, "语音对讲被阻断", blockers.join("；"), blockers.includes("省平台按钮触发权限未就绪") ? "按钮待授权" : "待人工接管");
        return;
      }
      a.remind = "语音对讲已播放";
      a.status = "已提醒";
      addTimeline(a, "语音对讲提醒", `通过省平台语音对讲入口播放固定话术：${a.script}`);
      toast("语音对讲已触发", "固定审核话术已播放，等待纠正检测。");
      render();
    }

    function sendText() {
      const a = currentAlarm();
      if (a.rule !== "规则已匹配") {
        blockAction(a, "文本下发被阻断", "规则未确认或存在口径差异，不能自动触发文本提醒。", "待规则确认");
        return;
      }
      const blockers = actionBlockers(a);
      if (blockers.length) {
        blockAction(a, "文本下发被阻断", blockers.join("；"), blockers.includes("省平台按钮触发权限未就绪") ? "按钮待授权" : "待人工接管");
        return;
      }
      a.remind = a.remind === "语音对讲已播放" ? "语音+文本已提醒" : "文本已下发";
      a.status = "已提醒";
      addTimeline(a, "文本下发", `通过省平台文本下发入口发送固定模板：${a.script}`);
      toast("文本已下发", "文本提醒动作和话术已写入台账。");
      render();
    }

    function observeCorrection() {
      const a = currentAlarm();
      if (a.remind === "未提醒" && !["设备故障报警", "疑似事故报警"].includes(a.type)) {
        toast("需要先提醒司机", "驾驶行为类报警应先按规则提醒，再观察是否纠正。");
        return;
      }
      if (a.video === "视频不可用" || a.confidence < 65) {
        a.correction = "无法判断";
        a.status = "待人工接管";
        addTimeline(a, "纠正检测无法判断", "视频不可用、低清或置信度不足，不能默认通过。");
        toast("无法判断", "已标记为人工接管，并建议短信通知值班人员。");
      } else if (a.risk === "高") {
        a.correction = "需人工复核";
        a.status = "待人工接管";
        addTimeline(a, "高风险复核阻断", "高风险报警不能由 AI 直接给出闭环结论，需值班业务人员人工复核。");
        toast("需人工复核", "高风险报警进入事件升级，AI 不给出自动通过结论。");
      } else {
        a.correction = "已纠正";
        a.status = "待归档";
        addTimeline(a, "纠正检测通过", "视频帧和页面状态显示报警风险已解除。");
        toast("已纠正", "可生成 AI 处理记录并归档。");
      }
      render();
    }

    function notifyDuty() {
      const a = currentAlarm();
      if (!checkReady("sms")) {
        blockAction(a, "短信通知被阻断", "短信通道未就绪，不能把通知写成已发送。", "待人工接管");
        return;
      }
      if (a.event === "短信已发送" || a.event === "值班已接收") {
        addTimeline(a, "重复通知被拦截", "事件已发送短信，不能用再次点击模拟值班人员已查看。");
        toast("不能代替接收", "短信发送不等于值班已接收，请在事件详情中执行查看确认。");
      } else {
        a.event = "短信已发送";
        a.status = "待人工接管";
        addTimeline(a, "值班短信通知", `短信已发送：${a.vehicle} ${a.type} ${a.correction}。`);
        toast("短信已发送", "值班业务人员将从详情页复制信息、拨打企业负责人并记录结果。");

      render();

    function makeRecord() {
      const a = currentAlarm();
      if (a.read === "字段缺失" || a.video === "视频不可用") {
        a.record = "待补证";
        addTimeline(a, "记录生成受限", "字段或视频证据缺失，记录保存为待补证状态。");
        toast("记录待补证", "异常原因已写入台账，不能自动归档。");
      } else if (["待规则确认", "口径差异"].includes(a.rule) || ["未纠正", "无法判断", "需人工复核"].includes(a.correction)) {
        a.record = "待人工确认";
        addTimeline(a, "记录生成受限", "规则未确认或检测结果未闭环，仅生成待人工确认记录。");
        toast("记录待人工确认", "不能归档为闭环记录。");
      } else {
        a.record = "已生成";
        if (a.status === "待归档") a.status = "已归档";
        addTimeline(a, "AI 处理记录生成", "已记录报警读取、规则匹配、司机提醒、纠正检测、短信和人工动作。");
        toast("处理记录已生成", "该报警已经进入 AI 处理记录台账。");
      }
      render();
    }

    function runFailureDrill() {
      const a = currentAlarm();
      if (a.capture === "未监听") return captureAlarm();
      if (a.read === "未读取") return readDetail();
      if (a.rule === "未匹配") return matchRule();
      const blockers = actionBlockers(a);
      if (blockers.length || a.rule !== "规则已匹配") {
        blockAction(a, "故障演练命中阻断", blockers.length ? blockers.join("；") : "规则未确认，不能继续自动处置。", a.rule === "规则已匹配" ? "待人工接管" : "待规则确认");
        return;
      }
      if (a.remind === "未提醒" && a.type !== "设备故障报警") return sendVoice();
      if (a.correction === "未判断") return observeCorrection();
      if (["未纠正", "无法判断", "需人工复核"].includes(a.correction) || a.risk === "高") return notifyDuty();
      if (a.record === "未生成") return makeRecord();
    }

    function copyInfo(id, type) {
      const a = alarms.find(item => item.id === id) || currentAlarm();
      if (!checkReady("eventAuth")) {
        addTimeline(a, "复制动作被阻断", "短信详情页访问控制未就绪，禁止复制完整关键信息或企业话术。");
        toast("复制被阻断", "请先在接入检查中完成详情页身份校验、有效期和脱敏策略。");
        render();
        return;
      }
      if (type === "script" && !checkReady("contacts")) {
        addTimeline(a, "话术复制被阻断", "企业负责人通讯录未就绪，禁止生成可外呼的话术。");
        toast("话术复制被阻断", "企业联系人来源和维护机制未确认。");
        render();
        return;
      }
      const text = type === "script" ? a.companyScript : infoPack(a);
      copyText(text);
      addTimeline(a, type === "script" ? "复制企业话术" : "复制关键信息", "值班业务人员在事件详情页执行复制操作。");
      toast("已复制", type === "script" ? "企业负责人沟通话术已复制。" : "关键信息包已复制。");
      render();
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.left = "-999px";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }

    function markViewed(id) {
      const a = alarms.find(item => item.id === id) || currentAlarm();
      if (!checkReady("eventAuth")) {
        blockAction(a, "查看确认被阻断", "详情页访问控制未就绪，不能把短信链接打开记录为已接收。", "待人工接管");
        return;

      a.event = "值班已接收";

      render();

      $("modalTitle").textContent = `${a.vehicle} 事件详情`;
      const eventAuthReady = checkReady("eventAuth");
      const contactsReady = checkReady("contacts");
      $("modalBody").innerHTML = `
        ${eventAuthReady ? "" : `<div class="blocker-note">访问控制未就绪：该弹层只展示脱敏信息。生产版本必须校验值班人员身份、链接有效期、访问范围和操作日志。</div>`}
        <div class="info-grid">
          <div class="info"><span>报警类型</span><strong>${esc(a.type)}</strong></div>
          <div class="info"><span>所属企业</span><strong>${esc(eventAuthReady ? a.company : a.company.slice(0, 4) + "****")}</strong></div>
          <div class="info"><span>驾驶员</span><strong>${esc(eventAuthReady ? a.driver : a.driver.slice(0, 1) + "**")}</strong></div>
          <div class="info"><span>检测结果</span><strong>${esc(a.correction)}</strong></div>
        </div>
        <div class="section-title"><h3>关键信息包</h3></div>
        <div class="copy-block">${esc(eventAuthReady ? infoPack(a) : maskedInfoPack(a))}</div>
        <div class="section-title"><h3>企业负责人话术</h3></div>
        <div class="copy-block">${esc(eventAuthReady && contactsReady ? a.companyScript : "企业负责人话术已隐藏：详情页访问控制和企业通讯录均需就绪后才允许展示。")}</div>
        <div class="section-title"><h3>处置时间线</h3></div>
        <div class="timeline">
          ${a.timeline.map(item => `<div class="timeline-item"><time>${esc(item[0])}</time><div><strong>${esc(item[1])}</strong><p>${esc(item[2])}</p></div></div>`).join("")}
        </div>
      `;
      $("modalFoot").innerHTML = `
        <button class="btn ${eventAuthReady ? "" : "blocked-action"}" onclick="copyInfo('${a.id}', 'info')">${icons.copy}<span>复制信息</span></button>
        <button class="btn primary ${eventAuthReady && contactsReady ? "" : "blocked-action"}" onclick="copyInfo('${a.id}', 'script')">${icons.copy}<span>复制话术</span></button>
        <button class="btn warn ${eventAuthReady && contactsReady ? "" : "blocked-action"}" onclick="dialCompany('${a.id}')">${icons.phone}<span>人工拨号</span></button>
        <button class="btn" onclick="closeModal()">关闭</button>
      `;
      $("modalBackdrop").classList.add("show");
    }

    function closeModal() {
      $("modalBackdrop").classList.remove("show");
    }

    function backdropClose(event) {
      if (event.target.id === "modalBackdrop") closeModal();
    }

    function simulateAlarm() {
      const sample = {
        id: `ALM-20260621-${Math.floor(1200 + Math.random() * 7000)}`,
        vehicle: "演示车辆-05",
        company: "示例客运企业 E",
        driver: "陈某",
        type: "接打手持电话报警",
        time: "2026-06-21 14:42:18",
        location: "示例高速路段 K1032+200",
        speed: 54,
        risk: "中",
        status: "待处置",
        capture: "已捕获",
        read: "未读取",
        rule: "未匹配",
        remind: "未提醒",
        correction: "未判断",
        event: "未触发",
        record: "未生成",
        source: "省平台实时报警弹窗",
        video: "视频可用",
        confidence: 74,
        frame: demoFrame,
        next: "语音对讲优先，观察驾驶员是否停止接打手持电话",
        script: "请立即停止接打手持电话，保持注意力集中，规范驾驶。",
        companyScript: "贵司演示车辆-05 发生接打手持电话报警，平台将按固定话术提醒司机，并观察是否纠正。",
        timeline: [["14:42:18", "模拟新报警", "省平台弹窗已被插件捕获，等待详情读取。"]]
      };
      alarms.unshift(sample);
      state.selectedAlarm = sample.id;
      state.queueFilter = "全部";
      toast("模拟新报警", `${sample.vehicle} 已进入实时报警队列。`);
      render();
    }

    function render() {
      renderNav();
      if (state.activeView === "workbench") renderWorkbench();
      if (state.activeView === "events") renderEvents();
      if (state.activeView === "ledger") renderLedger();
      if (state.activeView === "rules") renderRules();
      if (state.activeView === "scope") renderScope();
      if (state.activeView === "integration") renderIntegration();
      document.querySelectorAll(".view").forEach(node => node.classList.remove("active"));
      $(`view-${state.activeView}`).classList.add("active");
    }

    $("globalSearch").addEventListener("input", event => {
      state.globalSearch = event.target.value;
      render();
    });

    render();
  </script>
</body>
</html>
