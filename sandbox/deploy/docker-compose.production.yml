services:
  assistant:
    build:
      context: ..
      dockerfile: Dockerfile
    image: three-passenger-assistant:0.5.3
    env_file:
      - ../.env.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - assistant-report-exports:/var/lib/assistant/report-exports
      - assistant-evidence-exports:/var/lib/assistant/evidence-exports
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; r=urllib.request.urlopen(urllib.request.Request(
          'http://127.0.0.1:8000/health', headers={'X-Forwarded-Proto':'https'}), timeout=5);
          raise SystemExit(0 if r.status == 200 else 1)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

volumes:
  assistant-report-exports:
  assistant-evidence-exports:
